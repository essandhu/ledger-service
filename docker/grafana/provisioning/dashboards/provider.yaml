# Dashboard provider (M7 observability profile): loads every JSON under the mounted
# dashboards directory. allowUiUpdates false — the JSON in git is the source of truth.
apiVersion: 1

providers:
  - name: ledger
    orgId: 1
    folder: ""
    type: file
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
