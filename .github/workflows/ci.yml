name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # build runs: compile, all test suites (Testcontainers → real PostgreSQL on the runner's
      # Docker), ArchUnit rules, and the JaCoCo coverage gate (ratchet: TEST-STRATEGY.md §5).
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html
          if-no-files-found: ignore
      # The spec is produced by OpenApiDocumentationTest (content-asserted, never stale).
      # Deliberately NO `if: always()` and errors on absence: a skipped producer must fail
      # the pipeline loudly, not silently ship nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: build/openapi/openapi.json
          if-no-files-found: error

  smoke:
    name: docker-compose smoke test
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose file
        run: docker compose config -q
      - name: Bring up the full stack (waits on healthchecks)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Probe the stack
        # M0 walking-skeleton assertions: infra healthy, app healthy over anonymous HTTP,
        # security default-deny, and the real Keycloak issuer path — the one place the real
        # token flow is exercised (integration tests mint their own JWTs, TEST-STRATEGY §2).
        run: |
          set -euo pipefail

          curl -sf http://localhost:9000/health/ready > /dev/null
          echo "keycloak ready"

          # Capture-then-grep everywhere: under pipefail, `curl | grep -q` can fail spuriously
          # with 141 when grep exits at first match and curl catches SIGPIPE.
          health=$(curl -sf http://localhost:8080/actuator/health)
          grep -q '"status":"UP"' <<< "$health"
          echo "app healthy via anonymous /actuator/health"

          for path in /api/v1/accounts /actuator/metrics; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080$path")
            if [ "$code" != "401" ]; then
              echo "expected security default-deny (401) on unauthenticated $path, got $code"
              exit 1
            fi
          done
          echo "default-deny active"

          token_response=$(curl -s -X POST \
            -d grant_type=client_credentials -d client_id=ledger-cli -d client_secret=ledger-cli-dev-secret \
            http://localhost:8081/realms/ledger/protocol/openid-connect/token)
          token=$(jq -r '.access_token // empty' <<< "$token_response")
          if [ -z "$token" ]; then
            echo "failed to obtain a token from Keycloak (realm import broken? — PLAN §11); response:"
            echo "$token_response"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            http://localhost:8080/actuator/metrics)
          if [ "$code" != "200" ]; then
            echo "expected 200 on authenticated actuator call, got $code"
            exit 1
          fi
          echo "token flow OK — Keycloak-issued JWT accepted by the resource server"

          # --- M1 demo (PLAN §9): account lifecycle with real Keycloak tokens ---
          # No -f: under `set -e` it would kill the script before the diagnostic below runs,
          # and it suppresses the response body the diagnostic wants to print.
          account=$(curl -s -X POST -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name": "smoke-demo", "currency": "EUR", "type": "ASSET", "allowNegative": false}' \
            http://localhost:8080/api/v1/accounts)
          account_id=$(jq -r '.id // empty' <<< "$account")
          if [ -z "$account_id" ]; then
            echo "account create failed; response: $account"
            exit 1
          fi
          for target in FROZEN CLOSED; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              -d "{\"status\": \"$target\"}" \
              "http://localhost:8080/api/v1/accounts/$account_id")
            if [ "$code" != "200" ]; then
              echo "PATCH status=$target expected 200, got $code"
              exit 1
            fi
          done
          echo "lifecycle demo OK — create/freeze/close via real tokens"

          # --- M1 demo: the 403 half of the role matrix (I13), via the read-only client ---
          ro_response=$(curl -s -X POST \
            -d grant_type=client_credentials -d client_id=ledger-readonly -d client_secret=ledger-readonly-dev-secret \
            http://localhost:8081/realms/ledger/protocol/openid-connect/token)
          ro_token=$(jq -r '.access_token // empty' <<< "$ro_response")
          if [ -z "$ro_token" ]; then
            echo "failed to obtain a read-only token; response: $ro_response"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$account_id")
          if [ "$code" != "200" ]; then
            echo "read-only GET expected 200, got $code"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ro_token" -H 'Content-Type: application/json' \
            -d '{"name": "nope", "currency": "EUR", "type": "ASSET", "allowNegative": false}' \
            http://localhost:8080/api/v1/accounts)
          if [ "$code" != "403" ]; then
            echo "read-only POST expected 403, got $code"
            exit 1
          fi
          echo "role matrix demo OK — LEDGER_READ token: GET 200, POST 403"

          # --- M2 demo (PLAN §9): post a transfer, watch the rejection reasons, try to rewrite history ---
          # Two LIABILITY accounts (customer money is what the ledger owes): PLAN §5 pins the
          # signs — a transfer debits the source (+amount raw, natural balance falls) and credits
          # the target (−amount raw, natural rises). The source may go negative; the target may
          # not, which arms the overdraft probe below. Role note: ledger-cli's service account
          # carries ADMIN+WRITE+READ (the realm ships no write-only client), so $token plays
          # both the account-admin and the transfer-writer; $ro_token stays the reader.
          src=$(curl -s -X POST -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name": "m2-smoke-source", "currency": "EUR", "type": "LIABILITY", "allowNegative": true}' \
            http://localhost:8080/api/v1/accounts)
          src_id=$(jq -r '.id // empty' <<< "$src")
          if [ -z "$src_id" ]; then
            echo "source account create failed; response: $src"
            exit 1
          fi
          tgt=$(curl -s -X POST -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            -d '{"name": "m2-smoke-target", "currency": "EUR", "type": "LIABILITY", "allowNegative": false}' \
            http://localhost:8080/api/v1/accounts)
          tgt_id=$(jq -r '.id // empty' <<< "$tgt")
          if [ -z "$tgt_id" ]; then
            echo "target account create failed; response: $tgt"
            exit 1
          fi

          # -D - interleaves the response headers into the capture, so one request yields the
          # status (-w, on its own final line), the Location header, and the body (Spring writes
          # compact JSON: the single {-prefixed line).
          transfer=$(curl -s -D - -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"sourceAccountId\": \"$src_id\", \"targetAccountId\": \"$tgt_id\", \"amount\": {\"amount\": 12345, \"currency\": \"EUR\"}, \"description\": \"M2 smoke transfer\"}" \
            http://localhost:8080/api/v1/transfers)
          code=$(tail -n 1 <<< "$transfer")
          if [ "$code" != "201" ]; then
            echo "transfer expected 201, got $code; response: $transfer"
            exit 1
          fi
          entry=$(grep '^{' <<< "$transfer")
          entry_id=$(jq -r '.id // empty' <<< "$entry")
          if [ -z "$entry_id" ]; then
            echo "transfer response carries no entry id; response: $entry"
            exit 1
          fi
          if ! grep -qi "^location: /api/v1/journal-entries/$entry_id" <<< "$transfer"; then
            echo "transfer Location must address the created journal entry; response: $transfer"
            exit 1
          fi

          # Read it back as the read-only client: exactly two legs, zero-sum (I1), source
          # +12345 / target −12345 (debit-positive, PLAN §4.2).
          entry_read=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/journal-entries/$entry_id")
          code=$(tail -n 1 <<< "$entry_read")
          entry=$(head -n -1 <<< "$entry_read")
          if [ "$code" != "200" ]; then
            echo "read-only GET of the entry expected 200, got $code; response: $entry"
            exit 1
          fi
          legs_ok=$(jq --arg src "$src_id" --arg tgt "$tgt_id" \
            '(.postings | length) == 2
             and ([.postings[].amount.amount] | add) == 0
             and ([.postings[] | select(.accountId == $src).amount.amount] == [12345])
             and ([.postings[] | select(.accountId == $tgt).amount.amount] == [-12345])' <<< "$entry")
          if [ "$legs_ok" != "true" ]; then
            echo "entry legs are not the pinned ±12345 debit-positive pair; response: $entry"
            exit 1
          fi
          echo "transfer demo OK — 201 + Location, READ-token GET shows 2 zero-sum legs (I1)"

          # Every rejection is a 422 whose problem type names the reason — the exact ProblemTypes
          # URIs, one vocabulary with the ledger.posting.rejected metric tags (PLAN §8). First an
          # entry that does not balance (I1) ...
          rejection=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"description\": \"M2 smoke unbalanced\", \"postings\": [
                  {\"accountId\": \"$src_id\", \"amount\": {\"amount\": 100, \"currency\": \"EUR\"}},
                  {\"accountId\": \"$tgt_id\", \"amount\": {\"amount\": -60, \"currency\": \"EUR\"}}]}" \
            http://localhost:8080/api/v1/journal-entries)
          code=$(tail -n 1 <<< "$rejection")
          body=$(head -n -1 <<< "$rejection")
          if [ "$code" != "422" ]; then
            echo "unbalanced entry expected 422, got $code; response: $body"
            exit 1
          fi
          ptype=$(jq -r '.type // empty' <<< "$body")
          if [ "$ptype" != "https://essandhu.github.io/ledger/problems/unbalanced-entry" ]; then
            echo "unbalanced entry expected the unbalanced-entry problem type, got: $ptype; response: $body"
            exit 1
          fi
          # ... then an overdraft (I6): the target now holds 12345 and may not go negative, so
          # sending 99999 back out of it must be refused with nothing recorded.
          rejection=$(curl -s -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d "{\"sourceAccountId\": \"$tgt_id\", \"targetAccountId\": \"$src_id\", \"amount\": {\"amount\": 99999, \"currency\": \"EUR\"}, \"description\": \"M2 smoke overdraft\"}" \
            http://localhost:8080/api/v1/transfers)
          code=$(tail -n 1 <<< "$rejection")
          body=$(head -n -1 <<< "$rejection")
          if [ "$code" != "422" ]; then
            echo "overdrafting transfer expected 422, got $code; response: $body"
            exit 1
          fi
          ptype=$(jq -r '.type // empty' <<< "$body")
          if [ "$ptype" != "https://essandhu.github.io/ledger/problems/overdraft" ]; then
            echo "overdrafting transfer expected the overdraft problem type, got: $ptype; response: $body"
            exit 1
          fi
          echo "rejection demo OK — unbalanced-entry and overdraft both 422 with pinned problem types"

          # Try to rewrite history at the database (I3): psql as ledger_app — the runtime role,
          # not superuser — must be refused. The `if` inverts the exit code: this probe passes
          # only when psql errors; a successful UPDATE is the CI failure. The grep then pins the
          # failure to a privilege error, so a broken connection cannot masquerade as immutability.
          if update_out=$(docker compose exec -T postgres psql -U ledger_app -d ledger \
                -c 'UPDATE posting SET amount = amount + 1' 2>&1); then
            echo "I3 violated: UPDATE posting as ledger_app succeeded; output: $update_out"
            exit 1
          fi
          if ! grep -q 'permission denied' <<< "$update_out"; then
            echo "UPDATE posting failed, but not as a privilege error; output: $update_out"
            exit 1
          fi
          echo "immutability demo OK — UPDATE posting as ledger_app: permission denied (I3)"

          # --- M3 demo (PLAN §9): balance truth now HAS an HTTP surface — the ADR-0002
          # snapshot, an as-of derivation, and the keyset statement, all as the read-only
          # client. Exactly ±12345 with one posting each — the rejected probes above must
          # have left no residue (I4, now asserted over HTTP instead of psql).
          bal=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$src_id/balance")
          code=$(tail -n 1 <<< "$bal")
          body=$(head -n -1 <<< "$bal")
          if [ "$code" != "200" ]; then
            echo "source balance expected 200, got $code; response: $body"
            exit 1
          fi
          # Debited LIABILITY (PLAN §4.2): raw +12345, natural −12345, one posting, and asOf
          # ABSENT — the live snapshot omits the field (pinned at M3).
          summary=$(jq -r '[.rawBalance.amount, .balance.amount, .postingCount, has("asOf")] | join("|")' <<< "$body")
          if [ "$summary" != "12345|-12345|1|false" ]; then
            echo "source balance expected raw|natural|count|hasAsOf = 12345|-12345|1|false, got: $summary"
            exit 1
          fi
          tgt_bal=$(curl -s -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$tgt_id/balance")
          summary=$(jq -r '[.rawBalance.amount, .balance.amount, .postingCount] | join("|")' <<< "$tgt_bal")
          if [ "$summary" != "-12345|12345|1" ]; then
            echo "target balance expected raw|natural|count = -12345|12345|1, got: $summary"
            exit 1
          fi
          echo "balance demo OK — snapshots read ±12345|1 over HTTP, natural flips the LIABILITY sign (ADR-0002, PLAN §4.2)"

          # As-of (I10): at the entry's own posted_at the cut is inclusive; at 1970 it is empty.
          posted_at=$(jq -r '.postedAt // empty' <<< "$entry")
          if [ -z "$posted_at" ]; then
            echo "entry read-back carries no postedAt; response: $entry"
            exit 1
          fi
          asof=$(curl -s -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$src_id/balance?at=$posted_at")
          summary=$(jq -r '[.rawBalance.amount, .postingCount, .asOf] | join("|")' <<< "$asof")
          if [ "$summary" != "12345|1|$posted_at" ]; then
            echo "as-of at posted_at expected 12345|1|$posted_at, got: $summary"
            exit 1
          fi
          early=$(curl -s -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$src_id/balance?at=1970-01-01T00:00:00Z")
          summary=$(jq -r '[.rawBalance.amount, .postingCount] | join("|")' <<< "$early")
          if [ "$summary" != "0|0" ]; then
            echo "as-of at 1970 expected 0|0, got: $summary"
            exit 1
          fi
          echo "as-of demo OK — inclusive cut at posted_at, empty prefix at 1970 (I10)"

          # Statement (PLAN §5): one +12345 line linking back to the entry; the caught-up page
          # echoes the cursor (stateless tail-follow); a foreign cursor is a loud 400.
          page=$(curl -s -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$src_id/postings?limit=10")
          summary=$(jq -r '[(.content | length), .content[0].amount.amount, .content[0].entryId] | join("|")' <<< "$page")
          if [ "$summary" != "1|12345|$entry_id" ]; then
            echo "statement expected 1|12345|$entry_id, got: $summary"
            exit 1
          fi
          cursor=$(jq -r '.nextCursor // empty' <<< "$page")
          if [ -z "$cursor" ]; then
            echo "statement page carries no nextCursor; response: $page"
            exit 1
          fi
          page2=$(curl -s -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$src_id/postings?cursor=$cursor")
          summary=$(jq -r '[(.content | length), .nextCursor] | join("|")' <<< "$page2")
          if [ "$summary" != "0|$cursor" ]; then
            echo "caught-up page expected 0|$cursor, got: $summary"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $ro_token" \
            "http://localhost:8080/api/v1/accounts/$tgt_id/postings?cursor=$cursor")
          if [ "$code" != "400" ]; then
            echo "foreign cursor expected 400, got $code"
            exit 1
          fi
          echo "statement demo OK — keyset page, echoed cursor when caught up, foreign cursor 400 (M3)"

          docker compose logs --no-color app > app.log
          grep -q "Started LedgerApplication" app.log
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
