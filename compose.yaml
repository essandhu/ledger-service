name: ledger

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # postgres:18 images moved PGDATA under /var/lib/postgresql (not .../data) — mount the parent.
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin       # dev/demo stack only — never production settings
      KC_HEALTH_ENABLED: "true"
      # Fixed issuer so tokens minted from the host validate identically inside the network.
      KC_HOSTNAME: http://localhost:8081
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"   # issuer / admin console
      - "9000:9000"   # management: /health/ready, /health/live
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Official image ships no curl/wget; management port accepting connections is the container
      # signal — the CI smoke job additionally asserts /health/ready over HTTP from the host.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build: .
    environment:
      LEDGER_DB_URL: jdbc:postgresql://postgres:5432/ledger
      LEDGER_DB_USER: ledger_app
      LEDGER_DB_PASSWORD: ledger_app
      LEDGER_MIGRATE_USER: ledger_migrate
      LEDGER_MIGRATE_PASSWORD: ledger_migrate
      # Issuer as seen by token clients (host); JWKS fetched in-network.
      LEDGER_JWT_ISSUER_URI: http://localhost:8081/realms/ledger
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/ledger/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Real HTTP probe of /actuator/health — the one anonymous endpoint (SecurityConfig, M0).
      # The base image ships no curl/wget, so the request goes through bash's /dev/tcp; bash is
      # invoked explicitly because this Ubuntu-based image's /bin/sh is dash.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /actuator/health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  pgdata:
